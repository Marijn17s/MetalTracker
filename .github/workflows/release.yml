name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  WAILS_VERSION: v2.13.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Frontend build
        working-directory: frontend
        run: npm run build

      - name: Go tests
        run: go test ./...

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            asset: MetalTracker-Windows-x64-Setup.exe
          - os: macos-latest
            goos: darwin
            goarch: arm64
            asset: MetalTracker-macOS-AppleSilicon.dmg
          - os: macos-latest
            goos: darwin
            goarch: amd64
            asset: MetalTracker-macOS-Intel.dmg
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset: MetalTracker-Linux-x64.tar.gz

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux WebKit deps
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libgtk-3-dev libwebkit2gtk-4.1-dev

      # Wails -nsis shells out to makensis; without NSIS it still succeeds with only the .exe.
      - name: Install NSIS
        if: matrix.goos == 'windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $nsisBin = "C:\Program Files (x86)\NSIS"
          if (-not (Test-Path "$nsisBin\makensis.exe")) {
            $nsisBin = "C:\Program Files\NSIS"
          }
          if (-not (Test-Path "$nsisBin\makensis.exe")) {
            throw "makensis.exe not found after NSIS install"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $nsisBin
          & "$nsisBin\makensis.exe" /VERSION

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Import macOS signing certificate
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id-application.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/metaltracker-signing.keychain-db"

          printf '%s' "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$APPLE_KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY="$(
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" |
              awk -F '"' '/Developer ID Application/ { print $2; exit }'
          )"
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "Developer ID Application identity was not found" >&2
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Set product version in wails.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node <<'EOF'
          const fs = require('fs');
          const version = String(process.env.TAG || '').replace(/^v/, '');
          const path = 'wails.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.info = config.info || {};
          config.info.productVersion = version;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('productVersion =', version);
          EOF

      - name: Frontend install
        working-directory: frontend
        run: npm ci

      - name: Build
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          CGO_ENABLED: '1'
        run: |
          PLATFORM="${{ matrix.goos }}/${{ matrix.goarch }}"
          LDFLAGS="-X MetalTracker/internal/version.Version=${TAG}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            command -v makensis
            wails build -platform "$PLATFORM" -nsis -ldflags "$LDFLAGS"
            if ! ls build/bin/*installer*.exe >/dev/null 2>&1; then
              echo "wails -nsis finished but no installer was produced" >&2
              ls -la build/bin || true
              exit 1
            fi
          elif [ "${{ matrix.goos }}" = "linux" ]; then
            # Ubuntu 24.04+ has webkit2gtk-4.1 only (not 4.0).
            wails build -platform "$PLATFORM" -tags webkit2_41 -ldflags "$LDFLAGS"
          else
            wails build -platform "$PLATFORM" -ldflags "$LDFLAGS"
          fi

      - name: Sign macOS application
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          codesign \
            --force \
            --timestamp \
            --options runtime \
            --sign "$MACOS_SIGNING_IDENTITY" \
            build/bin/MetalTracker.app
          codesign --verify --deep --strict --verbose=2 build/bin/MetalTracker.app

      - name: Install DMG packaging dependencies
        if: matrix.goos == 'darwin'
        working-directory: build/darwin
        run: npm ci

      - name: Package assets
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Publish the NSIS Setup installer only (installs to Programs, Start Menu, etc.).
            if ls build/bin/*installer*.exe >/dev/null 2>&1; then
              cp build/bin/*installer*.exe "dist/${{ matrix.asset }}"
            elif ls build/bin/*setup*.exe >/dev/null 2>&1; then
              cp build/bin/*setup*.exe "dist/${{ matrix.asset }}"
            else
              echo "NSIS installer not found under build/bin" >&2
              ls -la build/bin || true
              exit 1
            fi
          elif [ "${{ matrix.goos }}" = "darwin" ]; then
            # Styled drag-to-Applications DMG (create-dmg layout + custom background).
            node build/darwin/package-dmg.mjs \
              build/bin/MetalTracker.app \
              "dist/${{ matrix.asset }}"
          else
            tar -czf "dist/${{ matrix.asset }}" -C build/bin MetalTracker
          fi
          ls -la dist

      - name: Sign and notarize macOS disk image
        if: matrix.goos == 'darwin'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DISK_IMAGE_PATH="dist/${{ matrix.asset }}"

          codesign \
            --force \
            --timestamp \
            --sign "$MACOS_SIGNING_IDENTITY" \
            "$DISK_IMAGE_PATH"
          codesign --verify --verbose=2 "$DISK_IMAGE_PATH"

          xcrun notarytool submit "$DISK_IMAGE_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DISK_IMAGE_PATH"
          xcrun stapler validate "$DISK_IMAGE_PATH"

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: metaltracker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: metaltracker-*
          merge-multiple: true

      - name: Build SHA256SUMS
        working-directory: artifacts
        run: |
          sha256sum MetalTracker-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MetalTracker ${{ github.ref_name }}
          generate_release_notes: true
          files: artifacts/*
