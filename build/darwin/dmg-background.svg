<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121214"/>
      <stop offset="55%" stop-color="#1a1816"/>
      <stop offset="100%" stop-color="#242018"/>
    </linearGradient>
    <radialGradient id="goldGlow" cx="50%" cy="32%" r="70%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panelFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf6ef" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#e8dfd0" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="panelHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="panelShadow" x="-8%" y="-12%" width="116%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>
  <rect width="660" height="400" fill="url(#goldGlow)"/>

  <g filter="url(#panelShadow)">
    <rect x="44" y="52" width="572" height="228" rx="28" ry="28" fill="url(#panelFill)"/>
    <rect x="44" y="52" width="572" height="228" rx="28" ry="28" fill="url(#panelHighlight)"/>
    <rect x="44.5" y="52.5" width="571" height="227" rx="27.5" ry="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.42" stroke-width="1"/>
    <rect x="44.5" y="52.5" width="571" height="227" rx="27.5" ry="27.5" fill="none" stroke="#d4af37" stroke-opacity="0.12" stroke-width="1"/>
  </g>

  <g opacity="0.72">
    <path d="M 286 152 H 368" stroke="#8a8278" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 354 140 L 368 152 L 354 164" fill="none" stroke="#8a8278" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="330" y="308" text-anchor="middle" fill="#f4efe6" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="17" font-weight="600">
    To install MetalTracker,
  </text>
  <text x="330" y="330" text-anchor="middle" fill="#d8d0c4" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="14" font-weight="400">
    drag the icon into the Applications folder
  </text>
</svg>
